name: wheel
description: "Kiln example: prize wheel. Images, slice count, background and drop rates are set from the Flutter host."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  kiln:
    path: ../../packages/kiln

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/scenes/
    - assets/images/
